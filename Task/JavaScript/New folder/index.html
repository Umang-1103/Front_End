<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card{
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            background: linear-gradient(135deg, #00feba, #5b548a);
            color: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            text-align: center;
        }
        .input-group{
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-group input{
            font-size: clamp(16px,2vw,25px);
            padding: 10px 20px;
            border: 0;
            outline: 0;
            border-radius: 20px;
        }
        .input-group button{
            font-size: clamp(16px,2vw,25px);
            padding: 10px 20px;
            border: 0;
            outline: 0;
            border-radius: 20px;
            cursor: pointer;
        }
        .weather-icon {
            width: 180px;
            margin-top: 30px;
        }
        .weather h1 {
            font-size: 80px;
            font-weight: 500;
        }
        .weather h2 {
            font-size: 42px;
            font-weight: 400;
            margin-top: -10px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin-top: 50px;
        }
        .col {
            display: flex;
            align-items: center;
            text-align: left;
            margin: 16px;
        }
        .col img {
            width: 55px;
            margin-right: 20px;
        }
        .humidity,
        .wind {
            font-size: 30px;
        }
        .weather {
            display: none;
        }

    </style>
</head>

<body>

    <div class="card">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Enter City Name">
            <button type="button" class="btn btn-danger">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="weather">
            <img src="./images/clear.png" class="weather-icon">
            <h1 class="temp">22</h1>
            <h2 class="city">Ahmedabad</h2>
            <div class="row">
                <div class="col">
                    <img src="./images/humidity.png" alt="">
                    <div>
                        <p class="humidity mb-0">50%</p>
                        <p class="mt-0">Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="./images/wind.png" alt="">
                    <div>
                        <p class="wind mb-0">50%</p>
                        <p class="mt-0">Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

        let apikey = "31646931d6787eec97894bfd88af64af"
        let apiid = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q="

        async function weather(city) {
            const res = await fetch(apiid + city + `&appid=${apikey}`)
            const result = await res.json()
            console.log(result)

            document.querySelector(".city").innerHTML = result.name
            document.querySelector(".temp").innerHTML = Math.round(result.main.temp) + "°C"
            document.querySelector(".humidity").innerHTML = result.main.humidity + "%"
            document.querySelector(".wind").innerHTML = result.wind.speed + "km/h"
            document.querySelector(".weather").style.display = "block"
        }

        let search_input = document.querySelector("input")
        let search_btn = document.querySelector("button")
        search_btn.addEventListener("click", () => {
            weather(search_input.value)
        })
        weather("ahmedabad")

    </script>

</body>

</html>
