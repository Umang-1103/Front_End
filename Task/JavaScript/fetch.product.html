<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">
        <div class="row">
            
        </div>
    </div>

    <script>

        fetch("https://dummyjson.com/products",{
            method:"GET"
        })
        .then((res) => {
            return res.json()
        })
        .then((data) => {
            console.log(data)

            for(content of data.products){
                console.log(content)

                let HTML_product = `
                    <div class="col-md-4 mt-2 mb-4">
                        <div class="card h-100">
                            <img src="${content.images}" class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">${content.title}</h5>
                                <p class="card-text">${content.description.slice(0,100)}....</p>
                                <p class="fs-5"><strong>${content.price} $</strong></p>
                                <a href="#" class="btn btn-primary"> Buy Now </a>
                            </div>
                        </div>
                    </div>
                `
                document.querySelector(".row").innerHTML += HTML_product
            }
        })

    </script>

</body>

</html>
