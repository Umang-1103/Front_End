<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</head>

<body>

    <div class="container m-4">
        <button class="btn btn-primary">A</button>
        <button class="btn btn-outline-success">B</button>
        <button class="btn btn-success btn-lg">C</button>
        <button class="btn btn-info btn-sm">D</button>
    </div>
    <br><br>

    <div class="btn-group">
        <button class="btn btn-primary">A</button>
        <button class="btn btn-secondary">B</button>
        <button class="btn btn-dark">C</button>
        <button class="btn btn-light">D</button>
    </div>
    <br><br>

    <div class="btn-group-vertical">
        <button class="btn btn-primary">A</button>
        <button class="btn btn-secondary">B</button>
        <button class="btn btn-dark">C</button>
        <button class="btn btn-light">D</button>
    </div>
    <br><br>

    <div class="container">
        <div class="alert alert-info">
            <strong>Win</strong> or <strong>Loss</strong>
        </div>
        <div class="alert alert-danger">
            <strong>Success!</strong> Indicates a successful or positive action.
        </div>
        <div class="alert alert-danger">
            <strong>Success!</strong> Indicates <a href="" class="alert-link">a positive action.</a>
        </div>
    </div>
    <br><br>

    <div class="container">
        <div class="spinner-border"></div>
        <div class="spinner-border text-muted"></div>
        <div class="spinner-border text-primary"></div>
        <div class="spinner-border text-success"></div>
        <div class="spinner-border text-info"></div>
        <div class="spinner-border text-warning"></div>
        <div class="spinner-border text-danger"></div>
        <div class="spinner-border text-secondary"></div>
        <div class="spinner-border text-dark"></div>
        <div class="spinner-border text-light"></div>
    </div>
    <br><br>

    <div class="container">
        <div class="spinner-grow"></div>
        <div class="spinner-grow text-muted"></div>
        <div class="spinner-grow text-primary"></div>
        <div class="spinner-grow text-success"></div>
        <div class="spinner-grow text-info"></div>
        <div class="spinner-grow text-warning"></div>
        <div class="spinner-grow text-danger"></div>
        <div class="spinner-grow text-secondary"></div>
        <div class="spinner-grow text-dark"></div>
        <div class="spinner-grow text-light"></div>
    </div>
    <br><br>

    <div class="container">
        <button class="btn btn-primary">
            <span class="spinner-border spinner-border-sm"></span>
            ABCD....
        </button>
        <button class="btn btn-danger">
            <span class="spinner-grow spinner-grow-lg"> </span>
            Loading....
        </button>
    </div>

</body>

</html>
