<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button id="btn">
        Click Me!
    </button>
    <h1 id="h1"></h1>

    <script>

        let btn = document.getElementById("btn")
        btn.addEventListener("click",function(){
            document.getElementById("h1").innerHTML += "Button Clicked!"
        })

    </script>
    
</body>
</html>
