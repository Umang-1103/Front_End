<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <script>

        let a = 10, b = 5
        console.log("A = ",a,"\nB = ",b)
        console.log("(a>5 && b<2) :- ",(a>5 && b>2) ? true : false)
        console.log("(a<5 && b<2) :- ",(a<5 && b<2) ? true : false)
        console.log("(a>5 || b<2) :- ",(a>5 || b<2) ? true : false)
        console.log("(a<5 || b<2) :- ",(a<5 || b<2) ? true : false)
        

    </script>
    
</body>
