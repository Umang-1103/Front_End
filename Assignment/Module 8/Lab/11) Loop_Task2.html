<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <script>

        let i=1,sum=0
        while(i<=20){
            if(i%2==0){
                sum = sum + i
                console.log("Even Number :- ",i)
            }
            i++
        }
        console.log("Sum :- ",sum)

    </script>
    
</body>
