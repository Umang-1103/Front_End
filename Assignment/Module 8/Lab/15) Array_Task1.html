    <script>

        let arr = ["Apple","Banana","Cherry"]
        console.log("Array of Fruits :- "+arr)
        
        console.log("Add Fruit At The End Of Array :- ")
        console.log(arr.push("Grapes"))
        console.log("Remove The First Fruit From The Array :- ")
        console.log(arr.shift())

        console.log("Array of Fruits :- "+arr)
    </script>
