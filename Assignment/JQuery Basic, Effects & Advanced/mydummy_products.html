<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">
        <div class="row">
            
        </div>
    </div>


    <script>

        fetch("https://api.mydummyapi.com/categories/products", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((res) => {
                console.log(res)

                let HTML_Product = res.map((user, index) => {

                    return(
                        `
                        <div class="col-md-3 mt-2 mb-4">
                            <div class="card h-100">
                                <img src="${user.image}" class="card-img-top" alt="...">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${user.name}</h5>
                                    <p class="card-text">${user.description.slice(0, 100)}....</p>
                                    <h5 class="card-title">${user.price}$</h5>
                                    <a href="#" class="btn btn-primary d-block mt-auto">Buy</a>
                                </div>
                            </div>
                        </div>
                        `
                    )
                    
                })
                document.querySelector(".row").innerHTML += HTML_Product.join("")
            })

    </script>

</body>

</html>
