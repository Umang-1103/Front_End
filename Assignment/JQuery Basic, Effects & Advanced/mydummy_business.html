<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>

    <table class="table">
        <thead>
            <th>Id</th>
            <th>Company</th>
            <th>Industry</th>
            <th>Catch Phrase</th>
            <th>Address</th>
        </thead>
        <tbody>
        
        </tbody>
    </table>

    <script>

        fetch("https://api.mydummyapi.com/categories/business", {
            method: "GET"
        })
            .then((res) => {
                return res.json()
            })
            .then((data) => {
                // console.log(data)
                for (index in data) {
                    console.log(data)
                    
                let HTML_business = `
                        <tbody>
                            <tr>
                                <td>${data[index].id}</td>
                                <td>${data[index].company}</td>
                                <td>${data[index].industry}</td>
                                <td>${data[index].catchPhrase}</td>
                                <td>${data[index].address}</td>
                            </tr>
                        </tbody>
                    `
                    document.querySelector("tbody").innerHTML += HTML_business
                }
            })

    </script>

</body>

</html>
